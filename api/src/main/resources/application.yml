# 키와 ${ENV_NAME} 참조만 둔다. 환경별 값·비밀 값은 ConfigMap·Secret(환경 변수)으로 주입한다 (CLAUDE.md §10).
# 기본값은 비밀이 아니고 환경과 무관한 값에만 둔다.
spring:
  application:
    name: tetra-ops-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false   # 요청 시작 때 기본 스키마로 세션이 열리지 않도록 끈다 (라우팅은 트랜잭션 시작 시점에 결정)
    hibernate:
      ddl-auto: none      # 스키마를 만들거나 바꾸지 않는다
  jackson:
    time-zone: Asia/Seoul
  cloud:
    aws:
      region:
        static: ${AWS_REGION}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: false        # 기동 때 마이그레이션하지 않는다. 테넌트 스키마는 등록 때 TenantSchemaCreator가 만든다

server:
  shutdown: graceful

# 프런트용 API 문서(/v3/api-docs, /swagger-ui.html). 기본 꺼짐, dev 등에서 API_DOCS_ENABLED=true로 켠다
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  paths-to-match: /api/**
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

tetra:
  env: ${TETRA_ENV}
  aws:
    region: ${AWS_REGION}
  sfn:
    approve-state-machine-arn: ${SFN_APPROVE_STATE_MACHINE_ARN}
    tenant-state-machine-arn: ${SFN_TENANT_STATE_MACHINE_ARN}
    # 수명 주기 결과 흐름 구분용 상태 머신 이름(ops-workflows 이름 규칙 tetra-{env}-…). 다르면 덮어쓴다
    lifecycle:
      hosting-start-name: tetra-${tetra.env}-hosting-start
      event-open-name: tetra-${tetra.env}-event-open
      event-end-name: tetra-${tetra.env}-event-end
  sqs:
    approve-result-queue: ${SQS_APPROVE_RESULT_QUEUE}
    tenant-result-queue: ${SQS_TENANT_RESULT_QUEUE}
    # WF2-1 · WF2-2 · WF4 공용 결과 큐(stateMachineArn으로 흐름 구분)
    event-lifecycle-result-queue: ${SQS_EVENT_LIFECYCLE_RESULT_QUEUE}
  mail:
    from: ${MAIL_FROM}
  portal:
    base-url: ${PORTAL_BASE_URL}
  # 선택. 리포트 메일에 넣는 콘솔 화면 링크({base-url}/logs/reports). 비우면 링크 대신 메뉴 경로만
  console:
    base-url: ${CONSOLE_BASE_URL:}
  # 이벤트 도메인 루트: {slug}.{tenant_id}.{platform-domain}. 환경별로 다르면 PLATFORM_DOMAIN으로 덮어쓴다
  platform-domain: ${PLATFORM_DOMAIN:tetraops.cloud}
  csv:
    presign-ttl: ${CSV_PRESIGN_TTL:PT5M}
  # 승인 전 검사: 기간이 겹치는 승인 이벤트 상한(Redis 노드 최대 수), 동시 승인 잠금 대기(초)
  approve:
    max-concurrent-events: ${MAX_CONCURRENT_EVENTS:3}
    lock-timeout-seconds: 5
  # 홈 모니터링 카드(클러스터 · 실시간 트래픽 · 테넌트 별 처리 현황) · OPS-05 트래픽 모니터링.
  # PROMETHEUS_URL이 비어 있으면 기동은 하고 모니터링만 stale
  monitoring:
    prometheus-url: ${PROMETHEUS_URL:}
    connect-timeout: ${PROMETHEUS_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${PROMETHEUS_READ_TIMEOUT:PT3S}
    cache-ttl: ${MONITORING_CACHE_TTL:PT15S}
    refresh-timeout: ${MONITORING_REFRESH_TIMEOUT:PT8S}
    # OPS-05 'Grafana에서 자세히' 링크. Grafana는 밖에 열려 있지 않아 운영자 PC의 포트 포워딩(pf-grafana) 주소가 기본. 비우면 링크 숨김
    grafana-url: ${GRAFANA_URL:http://localhost:13000}
    # OPS-05 AWS 지표(읽기 전용). 모두 선택 — 비어 있는 값의 항목만 null
    aws:
      cache-ttl: ${MONITORING_AWS_CACHE_TTL:PT60S}
      refresh-timeout: ${MONITORING_AWS_REFRESH_TIMEOUT:PT10S}
      issuance-alb-name: ${MONITORING_ISSUANCE_ALB_NAME:}
      console-alb: ${MONITORING_CONSOLE_ALB:}
      portal-alb: ${MONITORING_PORTAL_ALB:}
      console-tg: ${MONITORING_CONSOLE_TG:}
      portal-tg: ${MONITORING_PORTAL_TG:}
      console-tg-arn: ${MONITORING_CONSOLE_TG_ARN:}
      portal-tg-arn: ${MONITORING_PORTAL_TG_ARN:}
      rds-id: ${MONITORING_RDS_ID:}
      ecs-cluster: ${MONITORING_ECS_CLUSTER:}
      ecs-services: ${MONITORING_ECS_SERVICES:}
      dlq-names: ${MONITORING_DLQ_NAMES:}
      # 자동화 실행 상세(Step Functions ListExecutions, 상태 머신별) 캐시
      sfn-list-ttl: ${MONITORING_SFN_LIST_TTL:PT30S}
  # 1분 주기 자동화 확인(DLQ 메시지 · 단계 지연 운영자 알림). 여러 태스크면 GET_LOCK을 잡은 하나만 돈다.
  # DLQ 이름은 위 MONITORING_DLQ_NAMES를 같이 쓴다. delay-window = 단계 지연을 보는 기간(예정 시각부터, OPS-05 자동화 칸 공통)
  alerts:
    enabled: ${AUTOMATION_ALERTS_ENABLED:true}
    interval: ${AUTOMATION_ALERTS_INTERVAL:PT1M}
    delay-window: ${AUTOMATION_ALERTS_DELAY_WINDOW:PT24H}
  auth:
    jwt-secret: ${OPS_JWT_SECRET}
  password-link:
    hmac-secret: ${PASSWORD_LINK_HMAC_SECRET}
  db-migration:           # 테넌트 스키마 생성용 DDL 계정 tetra_migrator (금고 tetra/{env}/db/migrator)
    username: ${MIGRATOR_USERNAME}
    password: ${MIGRATOR_PASSWORD}
