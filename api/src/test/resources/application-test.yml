# 테스트 전용 값. 실제 환경 값·비밀이 아니다.
spring:
  datasource:
    # url·username·password는 테스트 베이스 클래스가 Testcontainers 값으로 넣는다
    url: jdbc:mysql://placeholder/tetra_platform
    username: placeholder
    password: placeholder
  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      sqs:
        enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

tetra:
  env: test
  aws:
    region: ap-northeast-2
  sfn:
    approve-state-machine-arn: arn:aws:states:ap-northeast-2:000000000000:stateMachine:approve
    tenant-state-machine-arn: arn:aws:states:ap-northeast-2:000000000000:stateMachine:tenant
  sqs:
    approve-result-queue: approve-result
    tenant-result-queue: tenant-result
    event-lifecycle-result-queue: event-lifecycle-result
  mail:
    from: Tetra Operation <no-reply@tetra-operation.com>
  portal:
    base-url: https://portal.example.test
  csv:
    presign-ttl: PT5M
  approve:
    max-concurrent-events: 3
    lock-timeout-seconds: 1
  # 1분 주기 자동화 확인은 스케줄로 돌리지 않는다(커넥션 풀 1개를 잡지 않게). 작업 테스트는 run()을 직접 부른다
  alerts:
    enabled: false
  # 리포트 메타 정리도 스케줄로 돌리지 않는다. 작업 테스트는 run()을 직접 부른다(운영자 리포트 버킷은 기본 규칙 tetra-operator-logs-test)
  # 이벤트 결과 리포트(리스너 시도 · 10분 보충)도 끈다 — 잠금이 풀 커넥션 1개를 잡는다. 테스트가 잠금 목으로 작업을 직접 만든다
  report:
    meta-cleanup:
      enabled: false
    event-result:
      enabled: false
  auth:
    jwt-secret: test-jwt-secret-0123456789abcdef0123456789
  password-link:
    hmac-secret: test-hmac-secret
  db-migration:
    # 테스트 베이스 클래스가 Testcontainers의 마이그레이션 계정으로 넣는다
    username: placeholder
    password: placeholder
