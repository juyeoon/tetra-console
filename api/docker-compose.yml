# 로컬 실행용 의존 서비스. 사용법은 dev-docs/로컬_실행.md
# - mysql: dev-docs/db/init의 DDL로 tetra_platform + 테넌트 스키마를 만들고 dev-docs/db/local의 seed를 넣는다.
#          앱 계정(DB_USERNAME)은 DML 권한만 받는다. 마이그레이션 계정(MIGRATOR_USERNAME)은 테넌트 등록 때 스키마를 만든다.
#          데이터를 다시 만들려면(계정 추가 포함) docker compose down -v
# - elasticmq: SQS 대체. Step Functions 결과 큐 2개(approve-result, tenant-result)를 미리 만든다.
# 값은 .env에서 읽는다(.env.example 참고, .env는 커밋하지 않음).
name: tetra-console-local

services:
  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+09:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?LOCAL_MYSQL_ROOT_PASSWORD를 .env에 넣어 주세요}
      APP_DB_USERNAME: ${DB_USERNAME:?DB_USERNAME을 .env에 넣어 주세요}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      MIGRATOR_DB_USERNAME: ${MIGRATOR_USERNAME:?MIGRATOR_USERNAME을 .env에 넣어 주세요}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD를 .env에 넣어 주세요}
      LOCAL_TENANT_IDS: "k7f2m9qx4b1t d4n8p2r6s0v1"
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - ./docker/local/mysql-init:/docker-entrypoint-initdb.d:ro
      - ./dev-docs/db/init:/ddl:ro
      - ./dev-docs/db/local:/seed:ro
      - tetra-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./docker/local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  tetra-mysql:
